name: kasir_pos_koperasi
description: Production-ready mobile POS app for koperasi using Flutter, Riverpod, GoRouter, and Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: ^2.8.2
  flutter_dotenv: ^5.2.1
  intl: ^0.20.1
  equatable: ^2.0.7
  uuid: ^4.5.1
  pdf: ^3.10.8
  printing: ^5.12.0
  excel: ^4.0.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_blurhash: ^0.9.1
  animations: ^2.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/env/.env
